name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uv sync --frozen --extra test --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -m 'not integration'

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: fastapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d fastapi_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uv sync --frozen --extra test
      - run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/fastapi_test
      - run: uv run pytest -m integration
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/fastapi_test
          LOG_TO_FILE: "false"

  production-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/smoke_prod_sim.sh
