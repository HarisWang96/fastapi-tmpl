[project]
name = "fastapi-tmpl"
version = "0.1.0"
description = "A production-oriented FastAPI async service template with PostgreSQL and Redis"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
authors = [
    {name = "HarisWang96"}
]
keywords = ["fastapi", "async", "template", "sqlalchemy", "redis", "postgresql"]
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.123.2",
    "sqlalchemy>=2.0.44",
    "uvicorn>=0.38.0",
    "pydantic-settings>=2.5.2",
    "alembic>=1.17.2",
    "redis>=7.1.0",
    "loguru>=0.7.3",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.urls]
Homepage = "https://github.com/HarisWang96/fastapi-tmpl"
Repository = "https://github.com/HarisWang96/fastapi-tmpl"

[tool.uv]
# This repository is an application, not an installable Python package.
package = false
